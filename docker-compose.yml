services:
  mongodb:
    image: mongo:7.0
    container_name: steam-cafe-mongodb
    restart: always
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"127.0.0.1:27017\"}]}).ok }'"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: steam-cafe-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
