<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Steam Cafe</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
<header class="navbar"><div class="container nav-container"><a href="../index.html" class="logo"><img src="../images/logo/steam-cafe-logo.jpeg" alt="Steam Cafe"></a><nav class="nav-links"><a href="../index.html">Home</a><a href="menu.html">Menu</a><a href="deals.html">Deals</a><a href="cart.html">Cart <b id="cart-count">0</b></a></nav><button class="mobile-menu-button" id="mobile-menu-button" aria-label="Open navigation" aria-expanded="false"><i class="fa-solid fa-bars"></i></button></div></header>
<main class="auth-page"><form class="auth-card" id="register-form"><p class="section-label">JOIN STEAM CAFE</p><h1>Create an account</h1><label for="register-name">Full name</label><input id="register-name" type="text" required autocomplete="name"><label for="register-email">Email</label><input id="register-email" type="email" required autocomplete="email"><label for="register-password">Password</label><input id="register-password" type="password" minlength="6" required autocomplete="new-password"><button class="btn btn-primary" type="submit">Register</button><p id="auth-message" role="status"></p><p class="auth-switch">Already registered? <a href="login.html">Login</a></p></form></main>
<script src="../js/main.js"></script><script src="../js/auth.js"></script>
</body>
</html>
