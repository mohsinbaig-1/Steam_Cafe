<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History | Steam Cafe</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/order-history.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="../index.html" class="logo">
                <img src="../images/logo/steam-cafe-logo.jpeg" alt="Steam Cafe">
            </a>
            <nav class="nav-menu" id="nav-menu">
                <a href="../index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="deals.html">Deals</a>
                <a href="order-history.html" class="active">Orders</a>
                <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart <span id="cart-count" class="cart-count">0</span></a>
                <a href="login.html" class="nav-login"><i class="fa-solid fa-user"></i> Login</a>
            </nav>
            <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </header>

    <main class="history-page">
        <section class="history-hero">
            <div class="container">
                <span class="section-tag">STEAM CAFE</span>
                <h1>Your Order History</h1>
                <p>Review your previous orders and their details, all saved on this device.</p>
            </div>
        </section>

        <section class="history-content container" aria-labelledby="history-heading">
            <div class="history-toolbar">
                <div>
                    <span class="section-label">YOUR ORDERS</span>
                    <h2 id="history-heading">Recent orders</h2>
                </div>
                <div class="order-filters" role="group" aria-label="Filter orders">
                    <button class="filter-button active" type="button" data-filter="all">All</button>
                    <button class="filter-button" type="button" data-filter="pending">Pending</button>
                    <button class="filter-button" type="button" data-filter="preparing">Preparing</button>
                    <button class="filter-button" type="button" data-filter="completed">Completed</button>
                </div>
            </div>

            <div id="order-history-list" class="order-history-list"></div>

            <div id="empty-history" class="empty-history" hidden>
                <div class="empty-icon"><i class="fa-solid fa-receipt"></i></div>
                <h2 id="empty-title">No orders yet</h2>
                <p id="empty-message">Your orders will appear here after you place your first order.</p>
                <a class="btn btn-primary" href="menu.html">Explore the Menu <i class="fa-solid fa-arrow-right"></i></a>
            </div>
        </section>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/order-history.js"></script>
</body>
</html>
